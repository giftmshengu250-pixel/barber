<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBS Queue</title>
</head>
<body>
    <div class="queue-container">
        <h1>Current Queue</h1>
        <ul id="queueList">
            <li>John Doe </li>
            <li>Jane Smith </li>  
        </ul>
    </div>

    <div class="add-to-queue">
        <h2>Add to Queue</h2>
        <form id="addToQueueForm">
            <input type="text" id="nameInput" placeholder="Enter name" required>
            <button type="submit">Join Queue</button>
        </form>
    </div>
    
</body>
</html>
